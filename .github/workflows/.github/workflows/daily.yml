name: Daily Publisher Hunt

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python main.py

      - name: Commit updated seen-domains state
        run: |
          git config user.name "publisher-hunter-bot"
          git config user.email "actions@github.com"
          git add data/seen_domains.json
          git diff --cached --quiet || git commit -m "Update seen domains $(date -u +%F)"
          git push
